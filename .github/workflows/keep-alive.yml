# ==========================================
# keep-alive.yml
# Version: 1.0.0
# Last Change: Keep ASA (Sales Agent) Render service awake
# ==========================================
# جلوگیری از sleep شدن سرویس رایگان Render
# هر ۵ دقیقه یک‌بار /health را صدا می‌زند.
#
# تنظیم:
# 1. این فایل را با پروژه به GitHub پوش کنید
#    (مسیر: .github/workflows/keep-alive.yml)
# 2. در Settings → Secrets and variables → Actions
#    یک secret بسازید: ASA_RENDER_URL
#    مقدار: https://YOUR-SERVICE.onrender.com
# 3. Actions را برای ریپو فعال نگه دارید
#
name: Keep ASA Render Alive

on:
  schedule:
    # هر ۵ دقیقه (روی پلن رایگان GitHub ممکن است کمی تأخیر داشته باشد)
    - cron: '*/5 * * * *'
  workflow_dispatch:  # اجرای دستی از تب Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ASA /health
        env:
          ASA_URL: ${{ secrets.ASA_RENDER_URL }}
        run: |
          if [ -z "$ASA_URL" ]; then
            echo "❌ Secret ASA_RENDER_URL تنظیم نشده است."
            echo "در GitHub → Settings → Secrets → Actions مقدار را بگذارید:"
            echo "  https://YOUR-SERVICE.onrender.com"
            exit 1
          fi

          # حذف اسلش انتهایی اگر وجود داشته باشد
          BASE_URL="${ASA_URL%/}"
          HEALTH_URL="${BASE_URL}/health"

          echo "🔔 Pinging ASA: ${HEALTH_URL}"

          HTTP_CODE=$(curl -s -o /tmp/asa_health.json -w "%{http_code}" \
            -X GET "${HEALTH_URL}" \
            -H "Accept: application/json" \
            --max-time 45 || echo "000")

          echo "HTTP status: ${HTTP_CODE}"

          if [ -f /tmp/asa_health.json ]; then
            echo "Response body:"
            cat /tmp/asa_health.json || true
            echo ""
          fi

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ ASA is alive!"
            exit 0
          else
            echo "❌ Connection failed (HTTP ${HTTP_CODE})"
            exit 1
          fi
